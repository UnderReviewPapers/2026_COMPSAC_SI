version: "3.9"

services:
  web:
    build: .
    container_name: django_app
    volumes:
      - ./ds-designer:/ds-designer
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-8000}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ds-designer_db
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
